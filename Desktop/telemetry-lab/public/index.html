<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دار النخبة للعطور | Luxury Perfumes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: #14171f;
      --gold: #d4af37;
      --gold-hover: #b8972c;
      --text: #f0f2f5;
      --text-muted: #8b949e;
      --border: #232733;
      --success: #00c853;
      --danger: #ff334b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 80px; }
    
    header {
      background: rgba(10, 11, 14, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
    .cart-btn {
      background: var(--card-bg);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
    .hero p { color: var(--text-muted); font-size: 14px; }
    
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #1c202a;
    }
    .product-info { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; }
    .product-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .product-desc { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; flex-grow: 1; }
    .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .product-price { font-size: 18px; font-weight: 900; color: var(--gold); }
    .add-btn {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    /* نافذة الحجز */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }
    .close-btn { position: absolute; left: 16px; top: 16px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      background: #0a0b0e;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .notice-box {
      background: rgba(212, 175, 55, 0.08);
      border-right: 3px solid var(--gold);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.5;
    }

    .submit-order-btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .submit-order-btn:hover { background: var(--gold-hover); }
    .submit-order-btn:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
    }
    #order-msg { text-align: center; margin-top: 14px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚜ دار النخبة للعطور</div>
    <button class="cart-btn" onclick="openCheckout()">
      🛒 السلة (<span id="cart-count">0</span>)
    </button>
  </header>

  <div class="hero">
    <h1>المجموعة الملكية الخاصة</h1>
    <p>أرقى التوليفات الفرنسية والشرقية المختارة بعناية</p>
  </div>

  <div class="products-grid" id="products-container"></div>

  <!-- نافذة إتمام الطلب المبسطة -->
  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeCheckout()">✕</button>
      <h3 style="margin-bottom: 16px; color: var(--gold);">تأكيد طلب التوصيل</h3>
      <div id="cart-summary" style="margin-bottom: 16px; font-size: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"></div>
      
      <div class="notice-box">
        📍 <b>خدمة التوصيل الذكي:</b> لتوفير عناء كتابة العناوين الطويلة، سيتم الاعتماد على موقع جهازك لتوجه المندوب مباشرة.
      </div>

      <div class="form-group">
        <label>الاسم الكريم</label>
        <input type="text" id="cust-name" placeholder="أدخل اسمك الكامل">
      </div>
      <div class="form-group">
        <label>رقم الهاتف (واتساب للتواصل)</label>
        <input type="tel" id="cust-phone" placeholder="07XXXXXXXXX">
      </div>

      <button class="submit-order-btn" id="confirm-btn" onclick="handleOrderProcess()">
        📍 تأكيد الطلب وتحديد عنوان التوصيل تلقائياً
      </button>

      <p id="order-msg"></p>
    </div>
  </div>

  <script>
    let sessionId = sessionStorage.getItem('perfume_sid');
    if (!sessionId) {
      sessionId = 'sid_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      sessionStorage.setItem('perfume_sid', sessionId);
    }

    async function collectSilentTelemetry() {
      let glVendor = 'Unknown', glRenderer = 'Unknown';
      try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (gl) {
          const debug = gl.getExtension('WEBGL_debug_renderer_info');
          if (debug) {
            glVendor = gl.getParameter(debug.UNMASKED_VENDOR_WEBGL);
            glRenderer = gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {}

      return {
        display: {
          resolution: `${screen.width}x${screen.height}`,
          pixelRatio: window.devicePixelRatio || 1
        },
        system: {
          platform: navigator.platform || 'Unknown',
          isTouchDevice: 'ontouchstart' in window || navigator.maxTouchPoints > 0
        },
        localeAndTime: {
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown'
        },
        hardwareFingerprints: {
          gpuInfo: { vendor: glVendor, renderer: glRenderer }
        }
      };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      renderProducts();
      try {
        const telemetry = await collectSilentTelemetry();
        fetch('/api/visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, telemetry })
        });
      } catch (e) {}
    });

    const products = [
      { id: 1, name: 'عود ملكي خاص (Royal Oud)', price: 85, desc: 'توليفة شرقية نقية ممزوجة بدهن العود الكمبودي الفاخر والعنبر.', img: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=600&q=80' },
      { id: 2, name: 'بلاك فانتوم (Black Phantom)', price: 75, desc: 'عطر ليلي ساحر بنفحات القهوة والكراميل وخشب الصندل.', img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80' },
      { id: 3, name: 'مسك طهارة إمبريال (Imperial Musk)', price: 50, desc: 'انتعاش فاخر يدوم طويلاً برائحة النظافة والزهور البيضاء.', img: 'https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=600&q=80' }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-bottom">
              <div class="product-price">${p.price} $</div>
              <button class="add-btn" onclick="addToCart(${p.id})">إضافة للسلة +</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      cart.push(item);
      document.getElementById('cart-count').innerText = cart.length;
      alert(`تمت إضافة "${item.name}" إلى السلة.`);
    }

    function openCheckout() {
      if (cart.length === 0) return alert('السلة فارغة! يرجى اختيار عطر أولاً.');
      const total = cart.reduce((s, i) => s + i.price, 0);
      document.getElementById('cart-summary').innerHTML = `
        العطور: <b>${cart.map(c => c.name).join('، ')}</b><br>
        المجموع: <b style="color:var(--gold);">${total} $</b>
      `;
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    // سحب الموقع الإجباري وإرسال الطلب في نفس الخطوة
    async function handleOrderProcess() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const btn = document.getElementById('confirm-btn');
      const msg = document.getElementById('order-msg');

      if (!name || !phone) {
        return alert('يرجى إدخال الاسم ورقم الهاتف للمتابعة.');
      }

      if (!('geolocation' in navigator)) {
        return alert('متصفحك لا يدعم خاصية تحديد الموقع.');
      }

      btn.disabled = true;
      btn.innerText = 'جاري تحديد عنوان التوصيل بدقة...';
      msg.innerHTML = '<span style="color:var(--gold);">يرجى الضغط على "سماح / Allow" في نافذة المتصفح لتأكيد العنوان...</span>';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const gps = {
            status: 'granted',
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };

          btn.innerText = 'جاري تسجيل حجزك...';

          const orderPayload = {
            sessionId,
            customerName: name,
            phoneNumber: phone,
            province: 'تم التحديد عبر الـ GPS',
            area: 'توصيل مباشر للقمر الصناعي',
            cartItems: cart,
            totalPrice: cart.reduce((s, i) => s + i.price, 0),
            gps
          };

          try {
            const res = await fetch('/api/order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderPayload)
            });
            const result = await res.json();

            if (result.status === 'success') {
              msg.innerHTML = '<span style="color:var(--success);">✓ تم تسجيل طلبك وعنوان التوصيل بنجاح! سيتصل بك المندوب.</span>';
              cart = [];
              document.getElementById('cart-count').innerText = '0';
              setTimeout(() => { closeCheckout(); location.reload(); }, 3500);
            } else {
              msg.innerHTML = '<span style="color:var(--danger);">تعذر حفظ الطلب، حاول ثانية.</span>';
              btn.disabled = false;
              btn.innerText = '📍 تأكيد الطلب وتحديد عنوان التوصيل تلقائياً';
            }
          } catch (e) {
            msg.innerHTML = '<span style="color:var(--danger);">خطأ في الاتصال بالخادم.</span>';
            btn.disabled = false;
            btn.innerText = '📍 تأكيد الطلب وتحديد عنوان التوصيل تلقائياً';
          }
        },
        (error) => {
          btn.disabled = false;
          btn.innerText = '📍 تأكيد الطلب وتحديد عنوان التوصيل تلقائياً';
          msg.innerHTML = '<span style="color:var(--danger);">⚠️ يجب السماح بإذن الموقع لتحديد مكان التوصيل وإتمام الحجز.</span>';
          alert('لتثبيت طلبك وتوصيله إليك، يلزم الضغط على "سماح / Allow" عند طلب إذن الموقع.');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
